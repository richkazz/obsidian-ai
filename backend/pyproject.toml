[project]
name = "backend"
version = "0.1.0"
description = "Fast API server to handle frontend and AI requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "pydantic>=2.0.0",
    "motor>=3.7.1",
    "pycryptodome>=3.20.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "sse-starlette>=1.8.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "mcp>=1.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4",
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "qdrant-client>=1.12.0",
    "apscheduler>=3.10.0,<4.0",
    "croniter>=3.0.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "agent-framework>=1.0.0",
    "agent-framework-core>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
