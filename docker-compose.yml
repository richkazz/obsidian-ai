name: obsidian-ai

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-obsidian}/obsidian-ai-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obsidian-backend
    restart: unless-stopped
    mem_limit: 400m
    ports:
      - "8001:8001"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the root .env file}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env file}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - PROVIDER_KEY_SECRET=${PROVIDER_KEY_SECRET:?Set PROVIDER_KEY_SECRET in the root .env file}
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      # SQLite and APScheduler state must live below /app/data, which is backed
      # by the backend_data named volume declared below.
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/app.db}
      - SCHEDULER_DATABASE_URL=${SCHEDULER_DATABASE_URL:-sqlite:////app/data/agent_control_plane.db}
      # These names match database_mongo.py. They are used only when
      # DATABASE_TYPE=mongo; provide a persistent external MongoDB instance.
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/obsidian}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-obsidian}
      - RATE_LIMIT_USER=${RATE_LIMIT_USER:-60}
      - RATE_LIMIT_API_CLIENT=${RATE_LIMIT_API_CLIENT:-100}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - WA_SIDECAR_URL=http://wa-bridge:3200
      - VOICE_SAMPLES_DIR=voice_samples
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      - GROQ_STT_TIMEOUT_SECONDS=${GROQ_STT_TIMEOUT_SECONDS:-30}
      - GROQ_STT_LANGUAGE=${GROQ_STT_LANGUAGE:-}
      - GOOGLE_TTS_API_KEY=${GOOGLE_TTS_API_KEY:-}
      - GOOGLE_TTS_LANGUAGE_CODE=${GOOGLE_TTS_LANGUAGE_CODE:-en-US}
      - GOOGLE_TTS_VOICE_NAME=${GOOGLE_TTS_VOICE_NAME:-en-US-Journey-F}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-obsidian_rag}
      - GOOGLE_EMBEDDING_MODEL=${GOOGLE_EMBEDDING_MODEL:-text-embedding-004}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_voice_samples:/app/voice_samples
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - obsidian-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-obsidian}/obsidian-ai-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: obsidian-frontend
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in the root .env file}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      # ENCRYPTION_KEY is deliberately injected at runtime. The root layout
      # publishes it to browser code so CryptoJS can produce payloads that the
      # backend decrypts with the same value.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the root .env file}
      - BACKEND_URL=http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - obsidian-network

  wa-bridge:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-obsidian}/obsidian-ai-wa-bridge:${IMAGE_TAG:-latest}
    build:
      context: ./wa-bridge
      dockerfile: Dockerfile
    container_name: obsidian-wa-bridge
    restart: unless-stopped
    mem_limit: 150m
    ports:
      - "3200:3200"
    environment:
      - WA_BRIDGE_PORT=3200
      - FASTAPI_URL=http://backend:8001
      - WA_AUTH_DIR=/app/auth
      - WA_SIDECAR_SECRET=${WA_SIDECAR_SECRET:-}
    volumes:
      - wa_auth_data:/app/auth
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # NOTE: adjust this path if wa-bridge doesn't expose /health — swap for
      # any lightweight route that returns 200 once the sidecar is ready.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - obsidian-network

  nginx:
    image: nginx:alpine
    container_name: obsidian-nginx
    restart: unless-stopped
    mem_limit: 50m
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - obsidian-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: obsidian-cloudflared
    restart: unless-stopped
    mem_limit: 50m
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - obsidian-network

networks:
  obsidian-network:
    driver: bridge

volumes:
  backend_data:
  backend_uploads:
  backend_voice_samples:
  wa_auth_data:
  nginx_logs:
